apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-api-workload
  namespace: autonomous-enterprise
  labels:
    app: sample-api-workload
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-api-workload
  template:
    metadata:
      labels:
        app: sample-api-workload
    spec:
      containers:
        - name: sample-api-workload
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: sample-api-workload
  namespace: autonomous-enterprise
spec:
  selector:
    app: sample-api-workload
  ports:
    - port: 80
      targetPort: 80
