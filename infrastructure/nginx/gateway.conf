# ------------------------------------------------------------------------------
# Autonomous Enterprise - nginx API Gateway
#
# Single public entrypoint for the platform. It fronts three upstreams:
#   /            -> web   (SvelteKit SPA served by its own nginx)
#   /api/        -> api   (NestJS, keeps the /api/v1 prefix intact)
#   /auth/       -> keycloak (identity provider)
#
# Because everything is served from one origin, the browser makes same-origin
# calls and CORS is not involved in normal operation.
# ------------------------------------------------------------------------------

# Trust the real client IP so rate limiting and audit logs are not keyed on the
# gateway's own address.
map $http_x_forwarded_for $ae_client_ip {
    ""      $remote_addr;
    default $http_x_forwarded_for;
}

# The API already enforces its own throttling (300 req/min); this is a coarser
# outer guard against a single client saturating the gateway.
limit_req_zone $binary_remote_addr zone=ae_api_rate:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=ae_conn:10m;

log_format ae_gateway '$remote_addr - $upstream_addr [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      'rt=$request_time urt=$upstream_response_time '
                      'req_id=$request_id';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/gateway.access.log ae_gateway;
    error_log  /var/log/nginx/gateway.error.log warn;

    server_tokens off;
    client_max_body_size 10m;
    limit_conn ae_conn 64;

    # Resolve upstreams at request time via the Docker/Kubernetes DNS server
    # rather than at startup. Without this, nginx refuses to boot whenever an
    # optional upstream (for example Keycloak) has not been started yet, and it
    # would also keep caching a stale IP after a container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    set $ae_web      "web:8080";
    set $ae_api      "api:3000";
    set $ae_keycloak "keycloak:8080";

    # Security headers applied to every response leaving the gateway.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Request-Id $request_id always;

    # --------------------------------------------------------------------------
    # Gateway self-check. Does not touch any upstream, so orchestrators can tell
    # "gateway is down" apart from "an upstream is down".
    # --------------------------------------------------------------------------
    location = /gateway/health {
        access_log off;
        add_header Content-Type application/json always;
        return 200 '{"status":"ok","component":"gateway"}';
    }

    # --------------------------------------------------------------------------
    # Server-Sent Events. Must come before the generic /api/ block: buffering and
    # read timeouts have to be disabled or the live event stream stalls.
    # --------------------------------------------------------------------------
    location = /api/v1/events/stream {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://$ae_api$request_uri;

        proxy_set_header Cache-Control 'no-cache';
        proxy_set_header Accept        'text/event-stream';

        proxy_buffering     off;
        proxy_cache         off;
        gzip                off;
        chunked_transfer_encoding on;

        proxy_read_timeout    24h;
        proxy_send_timeout    24h;
        proxy_connect_timeout 10s;

        add_header X-Accel-Buffering "no" always;
    }

    # --------------------------------------------------------------------------
    # REST API. The prefix is preserved because NestJS controllers are already
    # mounted under /api/v1.
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=ae_api_rate burst=60 nodelay;
        limit_req_status 429;

        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://$ae_api$request_uri;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # API liveness probe, exposed without rate limiting.
    location = /api/health {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://$ae_api/health;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Keycloak. The prefix is deliberately NOT stripped: Keycloak runs with
    # KC_HTTP_RELATIVE_PATH=/auth so the issuer, JWKS and redirect URLs it emits
    # already contain /auth and stay valid behind the gateway.
    # --------------------------------------------------------------------------
    location /auth/ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://$ae_keycloak$request_uri;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;

        # Keycloak emits large auth cookies and JWKS payloads.
        proxy_buffer_size   16k;
        proxy_buffers       8 16k;
        proxy_busy_buffers_size 32k;
    }

    # --------------------------------------------------------------------------
    # Everything else is the SPA.
    # --------------------------------------------------------------------------
    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://$ae_web$request_uri;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
