# ------------------------------------------------------------------------------
# Static file server for the SvelteKit SPA bundle.
#
# This server does no proxying: all API routing is the gateway's job. It only
# serves the compiled assets and falls back to index.html for client-side
# routes such as /office or /experiments.
# ------------------------------------------------------------------------------

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Hashed build assets are immutable and safe to cache aggressively.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Sprites and room artwork for the virtual office simulator.
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # Rewritten on every container start, so it must never be cached.
    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
