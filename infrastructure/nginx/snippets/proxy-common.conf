# ------------------------------------------------------------------------------
# Common proxy headers, included by every gateway location.
#
# This has to be an include rather than server-level directives: in nginx,
# defining any proxy_set_header inside a location discards *all* proxy_set_header
# directives inherited from the parent block. Because each location needs at
# least `Connection ''` for upstream keepalive, server-level headers such as
# Host and X-Forwarded-* would silently disappear.
# ------------------------------------------------------------------------------

proxy_http_version 1.1;

# Empty Connection header enables keepalive to the upstream.
proxy_set_header Connection        "";

# $http_host is used instead of $host so a non-standard public port (for example
# http://localhost:8088 during local development) is preserved. Keycloak builds
# its issuer and redirect URLs from these headers, and dropping the port would
# make every generated URL point at the wrong address.
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $ae_client_ip;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $http_host;
proxy_set_header X-Request-Id      $request_id;
