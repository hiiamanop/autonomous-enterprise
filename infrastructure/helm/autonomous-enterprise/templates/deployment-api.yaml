apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autonomous-enterprise.fullname" . }}-api
  labels:
    {{- include "autonomous-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "autonomous-enterprise.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "autonomous-enterprise.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      annotations: {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ include "autonomous-enterprise.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
        seccompProfile: {{- toYaml .Values.securityContext.seccompProfile | nindent 10 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "autonomous-enterprise.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: api
        {{- with .Values.affinity }}{{- toYaml . | nindent 8 }}{{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            allowPrivilegeEscalation: false
            capabilities: {{- toYaml .Values.securityContext.capabilities | nindent 14 }}
          ports: [{name: http, containerPort: {{ .Values.api.port }}, protocol: TCP}]
          envFrom:
            - configMapRef: {name: {{ include "autonomous-enterprise.fullname" . }}-api}
            {{- if .Values.postgres.secretRef.name }}
            - secretRef: {name: {{ .Values.postgres.secretRef.name }}, optional: true}
            {{- end }}
          env:
            {{- if .Values.postgres.secretRef.name }}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.postgres.secretRef.name }}, key: {{ .Values.postgres.secretRef.key }}, optional: true}}
            {{- end }}
            {{- if .Values.redis.secretRef.name }}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.redis.secretRef.name }}, key: {{ .Values.redis.secretRef.key }}, optional: true}}
            {{- end }}
            {{- with .Values.api.extraEnv }}{{- toYaml . | nindent 12 }}{{- end }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe: {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe: {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
      {{- with .Values.imagePullSecrets }}imagePullSecrets: {{- toYaml . | nindent 8 }}{{- end }}
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{- toYaml .Values.tolerations | nindent 8 }}
