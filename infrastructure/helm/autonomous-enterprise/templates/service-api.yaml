apiVersion: v1
kind: Service
metadata:
  name: {{ include "autonomous-enterprise.fullname" . }}-api
  labels:
    {{- include "autonomous-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "autonomous-enterprise.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
  type: ClusterIP
