apiVersion: v1
kind: Service
metadata:
  name: {{ include "autonomous-enterprise.fullname" . }}-web
  labels:
    {{- include "autonomous-enterprise.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "autonomous-enterprise.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: http
  type: ClusterIP
