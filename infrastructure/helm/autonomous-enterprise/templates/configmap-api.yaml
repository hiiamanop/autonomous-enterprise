apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "autonomous-enterprise.fullname" . }}-api
  labels: {{- include "autonomous-enterprise.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.global.environment | quote }}
  {{- range $key, $value := .Values.api.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  TENANT_DEFAULTS: {{ .Values.global.tenantDefaults | toJson | quote }}
  KEYCLOAK_ISSUER: {{ .Values.keycloak.issuer | quote }}
  KEYCLOAK_JWKS_URI: {{ .Values.keycloak.jwksUri | quote }}
  KEYCLOAK_AUDIENCE: {{ .Values.keycloak.audience | quote }}
  KAFKA_BROKERS: {{ join "," .Values.kafka.brokers | quote }}
