{{- if .Values.role.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "autonomous-enterprise.fullname" . }}-infra-agent
  labels: {{- include "autonomous-enterprise.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "autonomous-enterprise.serviceAccountName" . }}
roleRef:
  kind: Role
  name: {{ include "autonomous-enterprise.fullname" . }}-infra-agent
  apiGroup: rbac.authorization.k8s.io
{{- end }}
