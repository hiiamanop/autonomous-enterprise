apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: autonomous-enterprise-api
  namespace: autonomous-enterprise
  labels:
    app.kubernetes.io/part-of: autonomous-enterprise
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: api
      app.kubernetes.io/part-of: autonomous-enterprise
  endpoints:
    - port: http
      path: /api/v1/metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: tenant_namespace
