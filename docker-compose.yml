services:
  postgres:
    image: postgres:16-alpine
    container_name: ae-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_postgres_password_here}
      POSTGRES_DB: ${POSTGRES_DB:-autonomous_enterprise}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-autonomous_enterprise}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: ae-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-your_redis_password_here} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-your_redis_password_here}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: ae-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: ae-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-your_keycloak_admin_password_here}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-your_postgres_password_here}
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
      # Served through the gateway at /auth, so Keycloak must generate issuer
      # and redirect URLs that already include that prefix.
      KC_HTTP_RELATIVE_PATH: ${KEYCLOAK_RELATIVE_PATH:-/auth}
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: 'false'
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e \"GET ${KEYCLOAK_RELATIVE_PATH:-/auth}/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: autonomous-enterprise/api:local
    container_name: ae-api
    restart: unless-stopped
    environment:
      # This compose file is the local development stack. NODE_ENV is left at
      # development on purpose: TenantGuard rejects every request without a
      # bearer token when NODE_ENV=production, so a production value here would
      # make the whole UI return 401 until a real Keycloak realm is configured.
      # Deployed environments set NODE_ENV=production via Helm values instead.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      # 'prisma' persists to PostgreSQL; anything else keeps the in-memory
      # repositories, whose data is lost on every API restart.
      DATABASE_DRIVER: ${DATABASE_DRIVER:-prisma}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-your_postgres_password_here}@postgres:5432/${POSTGRES_DB:-autonomous_enterprise}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_URL: redis://:${REDIS_PASSWORD:-your_redis_password_here}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-your_redis_password_here}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-autonomous-enterprise-api}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-enterprise.events}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-autonomous-enterprise-workers}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://keycloak:8080/realms/autonomous-enterprise}
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI:-http://keycloak:8080/realms/autonomous-enterprise/protocol/openid-connect/certs}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-autonomous-enterprise-api}
      AUTH_BYPASS_HEADER_TRUST: ${AUTH_BYPASS_HEADER_TRUST:-false}
      OMNIROUTER_BASE_URL: ${OMNIROUTER_BASE_URL:-}
      OMNIROUTER_API_KEY: ${OMNIROUTER_API_KEY:-}
      # A localhost URL in .env refers to the host machine, but inside the
      # container localhost is the container itself. host.docker.internal is
      # rewritten below via extra_hosts so an AI provider running on the host
      # stays reachable. Without this the agents fall back to
      # "AI provider is not configured" and take no autonomous action.
      API_URL_AI_PROVIDER: ${API_URL_AI_PROVIDER_CONTAINER:-${API_URL_AI_PROVIDER:-}}
      PROVIDER_API_KEY: ${PROVIDER_API_KEY:-}
      AI_MODEL_REASONING: ${AI_MODEL_REASONING:-}
      SIMULATOR_AGENT_MODE: ${SIMULATOR_AGENT_MODE:-true}
      # Requests arrive through the gateway on the same origin, so CORS only
      # needs to cover direct browser access during local debugging.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
    extra_hosts:
      # Linux Docker does not provide host.docker.internal by default.
      - "host.docker.internal:host-gateway"
    expose:
      - "3000"
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: autonomous-enterprise/web:local
    container_name: ae-web
    restart: unless-stopped
    environment:
      # Relative URL: the browser calls the gateway it was served from, so the
      # same image works locally and in any deployed environment.
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api/v1}
    expose:
      - "8080"
    depends_on:
      - api
    networks:
      - app-network

  gateway:
    image: nginx:1.27-alpine
    container_name: ae-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      - web
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/gateway/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  kafka_data:

networks:
  app-network:
    driver: bridge
